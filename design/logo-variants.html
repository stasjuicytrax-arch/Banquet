<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Варианты логотипа · Случайности</title>
  <link rel="stylesheet" href="../prototype/fonts/fonts.css?v=2">
  <link rel="stylesheet" href="../prototype/site.css?v=13">
  <style>
    .compare { padding-block: 26px 68px; }
    .compare h1 { margin-block: 18px 26px; font: 400 clamp(2.1rem, 5vw, 4.75rem)/1.1 Prata, Georgia, serif; }
    .variants { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(12px, 3vw, 36px); }
    .variant { display: grid; grid-template-rows: auto 1fr auto; gap: 18px; align-items: center; min-height: 244px; padding: clamp(16px, 3vw, 42px); border: 1px solid var(--line); border-radius: 14px; }
    .variant h2 { font: 650 1rem Manrope, sans-serif; letter-spacing: normal; }
    .variant p { font-size: .92rem; color: var(--muted); }
    .variant svg, .variant img { width: 100%; height: auto; }
    .variant mark { padding: 3px 6px; border-radius: 4px; background: var(--rose); color: var(--ink); font-size: .75rem; }
    @media (max-width: 680px) { .variants { grid-template-columns: 1fr; } .variant { min-height: 195px; } }
  </style>
</head>
<body>
  <main class="compare frame">
    <a class="text-link" href="../">Вернуться на сайт</a>
    <h1>Логотип «Случайности»</h1>
    <div class="variants">
      <figure class="variant">
        <h2>Исходный знак <mark>Сейчас на сайте</mark></h2>
        <img src="../prototype/wordmark.svg" width="1376" height="222" alt="Случайности с розовой дугой над й">
        <figcaption><p>Плотное начертание и широкая розовая дуга.</p></figcaption>
      </figure>
      <figure class="variant">
        <h2>1. Тонкая дуга</h2>
        <svg viewBox="104 386 1376 222" role="img" aria-label="Случайности с тонкой розовой дугой над й">
          <use href="../prototype/wordmark.svg#letters"/>
          <path d="M756 418q49-47 98 0" fill="none" stroke="#c98598" stroke-width="10" stroke-linecap="round"/>
        </svg>
        <figcaption><p>Тоньше и выше над буквой, с мягкими концами.</p></figcaption>
      </figure>
      <figure class="variant">
        <h2>2. Дуга из двух штрихов</h2>
        <svg viewBox="104 386 1376 222" role="img" aria-label="Случайности с розовой дугой из двух штрихов">
          <use href="../prototype/wordmark.svg#letters"/>
          <path d="M755 417q20-20 43-20m15 0q22 1 42 20" fill="none" stroke="#c98598" stroke-width="13" stroke-linecap="round"/>
        </svg>
        <figcaption><p>Разрыв по центру оставляет больше воздуха над буквой.</p></figcaption>
      </figure>
      <figure class="variant">
        <h2>3. Розовая лента</h2>
        <svg viewBox="104 386 1376 222" role="img" aria-label="Случайности с широкой розовой лентой над й">
          <use href="../prototype/wordmark.svg#letters"/>
          <path d="M752 419c17-22 39-34 62-32 20 2 37 14 47 28l-12 10c-12-12-25-16-43-17-19-1-37 4-54 11Z" fill="#c98598"/>
        </svg>
        <figcaption><p>Асимметричный изгиб с широким правым краем.</p></figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
